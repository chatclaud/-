<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ChatClaud — скоро</title>
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="/IMG_5637.png" type="image/png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      background: #000;
      color: #eee;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      overflow: hidden;
    }
    .wrap {
      text-align: center;
      max-width: 420px;
      width: 100%;
    }
    .logo {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      object-fit: cover;
      margin: 0 auto 1.4rem;
      display: block;
      box-shadow: 0 0 40px rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
    }
    .brand {
      font-size: 1.35rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 0.35rem;
      color: #fff;
    }
    .sub {
      font-size: 0.95rem;
      color: rgba(255,255,255,0.45);
      margin-bottom: 2rem;
      line-height: 1.45;
    }
    .clock {
      font-variant-numeric: tabular-nums;
      font-size: clamp(2.8rem, 12vw, 3.6rem);
      font-weight: 300;
      letter-spacing: 0.04em;
      color: #fff;
      margin-bottom: 0.5rem;
    }
    .date {
      font-size: 0.85rem;
      color: rgba(255,255,255,0.35);
      margin-bottom: 2.2rem;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      padding: 0.55rem 1rem;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.04);
      font-size: 0.8rem;
      color: rgba(255,255,255,0.7);
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 10px rgba(74,222,128,0.6);
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.85); }
    }
    .hint {
      margin-top: 1.8rem;
      font-size: 0.75rem;
      color: rgba(255,255,255,0.28);
      line-height: 1.5;
    }
    .bar {
      margin: 1.6rem auto 0;
      width: 120px;
      height: 2px;
      border-radius: 2px;
      background: rgba(255,255,255,0.08);
      overflow: hidden;
    }
    .bar > i {
      display: block;
      height: 100%;
      width: 40%;
      background: linear-gradient(90deg, transparent, #fff, transparent);
      animation: slide 1.8s ease-in-out infinite;
    }
    @keyframes slide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(300%); }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="/IMG_5637.png" alt="ChatClaud"
         onerror="this.style.display='none'">
    <div class="brand">ChatClaud</div>
    <p class="sub">Мы что-то делаем.<br>Скоро снова онлайн.</p>

    <div class="clock" id="clock">--:--:--</div>
    <div class="date" id="date"></div>

    <div class="status">
      <span class="dot"></span>
      В разработке
    </div>
    <div class="bar"><i></i></div>
    <p class="hint">Обновление сервера и настроек.<br>Загляни чуть позже.</p>
  </div>
  <script>
    function tick() {
      var now = new Date();
      var h = String(now.getHours()).padStart(2, '0');
      var m = String(now.getMinutes()).padStart(2, '0');
      var s = String(now.getSeconds()).padStart(2, '0');
      var el = document.getElementById('clock');
      if (el) el.textContent = h + ':' + m + ':' + s;
      var d = document.getElementById('date');
      if (d) {
        d.textContent = now.toLocaleDateString('ru-RU', {
          weekday: 'long', day: 'numeric', month: 'long'
        });
      }
    }
    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
